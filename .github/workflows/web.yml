# Web de oficina · cada Pull Request que toca web/ corre TypeScript, las pruebas de Vitest y el build.
# Así un cambio de diseño no rompe la web sin que nadie lo note (Definición de Terminado: pruebas que
# corren sin levantar la base). No necesita secretos.
name: web

on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint (errores frenan; avisos no)
        run: npm run lint
      - name: Pruebas (Vitest)
        run: npm test
      - name: TypeScript y build (tsc -b && vite build)
        run: npm run build
      - name: Presupuesto de peso (JS de arranque, CSS y total)
        run: npm run presupuesto

  visual:
    # pruebas visuales del rediseño (Playwright, datos de ejemplo): no necesitan la API ni secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json
      - name: Dependencias de la web
        working-directory: web
        run: npm ci
      - name: Dependencias de Playwright y Chromium
        working-directory: web/e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Pruebas visuales (escritorio y celular)
        working-directory: web/e2e
        run: npm run visual
      - name: Informe si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-visual
          path: web/e2e/informe-visual
