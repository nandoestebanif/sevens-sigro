# SonarCloud · app del almacenero (Kotlin Multiplatform)
# Cobertura: Kover → ./gradlew :composeApp:testDebugUnitTest :composeApp:koverXmlReportDebug
#            y luego python3 scripts/kover_a_sonar.py (formato genérico: ver el script)
sonar.organization=nandoestebanif
sonar.projectKey=nandoestebanif_sigro-app
sonar.projectName=SIGRO · app del almacenero
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# SonarCloud ya no usa sonar.sources: analiza toda la carpeta. El alcance se fija con exclusiones.
# Fuera: lienzos de diseño y su generador, scripts de medición, iOS y escritorio (no exigidos; escritorio
# solo sirve para las capturas), recursos de Android y todo lo generado.
sonar.exclusions=diseno/**,scripts/**,iosApp/**,composeApp/src/iosMain/**,composeApp/src/desktopMain/**,composeApp/src/androidMain/res/**,**/build/**,**/generated/**,composeApp/schemas/**
sonar.test.inclusions=composeApp/src/commonTest/**

sonar.coverageReportPaths=build/sonar-cobertura.xml
# Las pantallas Compose se prueban en el celular (matriz de dispositivos y modo avión), no con pruebas unitarias:
# se excluyen solo del cálculo de cobertura, no del análisis de calidad. Las pruebas (commonTest, androidUnitTest,
# desktopTest) tampoco cuentan:
# SonarCloud no las reconoce solas como pruebas en Kotlin Multiplatform y las sumaba como código sin cubrir.
# App.kt es la raíz Compose (tema, Koin y navegación entre pantallas): es interfaz igual que ui/**; su lógica
# vive en funciones probadas (obrasDe, indiceDeObra en ui/pantallas/Raiz.kt y CambiarObraTest).
sonar.coverage.exclusions=composeApp/src/commonTest/**,composeApp/src/androidUnitTest/**,composeApp/src/desktopTest/**,**/ui/**,**/pe/sevens/sigro/App.kt,**/plataforma/**,**/di/**,**/*.android.kt,**/MainActivity.kt,**/datos/local/**
