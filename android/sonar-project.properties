# SonarCloud · app del almacenero (Kotlin Multiplatform)
# Cobertura: Kover → ./gradlew :composeApp:testDebugUnitTest :composeApp:koverXmlReportDebug
# Organización y proyectos creados en SonarCloud el 25/11/2026 (monorepo: un proyecto por carpeta).
sonar.organization=nandoestebanif
sonar.projectKey=nandoestebanif_sigro-app
sonar.projectName=SIGRO · app del almacenero
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8
sonar.sources=composeApp/src/commonMain,composeApp/src/androidMain
sonar.tests=composeApp/src/commonTest
# iOS no es exigido por el docente; escritorio solo sirve para capturas en la PC
sonar.exclusions=**/build/**,**/generated/**,composeApp/src/androidMain/res/**

# Reporte de Kover en formato JaCoCo (Sonar lo lee directo)
sonar.coverage.jacoco.xmlReportPaths=composeApp/build/reports/kover/reportDebug.xml
# Las pantallas Compose se prueban en el celular (matriz de dispositivos y modo avión), no con pruebas unitarias:
# se excluyen solo del cálculo de cobertura, no del análisis de calidad.
sonar.coverage.exclusions=**/ui/**,**/plataforma/**,**/di/**,**/*.android.kt,**/MainActivity.kt,**/datos/local/**
