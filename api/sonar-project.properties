# SonarCloud · backend FastAPI (microservicios + gateway)
# Cobertura: pytest-cov → python -m pytest --cov=app --cov-report=xml   (deja coverage.xml aquí)
sonar.organization=nandoestebanif
sonar.projectKey=nandoestebanif_sigro-api
sonar.projectName=SIGRO · servicio
sonar.projectVersion=1.0.0

sonar.sourceEncoding=UTF-8
sonar.sources=app
sonar.tests=pruebas
sonar.python.version=3.13
sonar.exclusions=**/__pycache__/**

sonar.python.coverage.reportPaths=coverage.xml
# Los modelos SQLAlchemy solo declaran tablas (Alembic los usa para «alembic check»); no tienen lógica que cubrir.
sonar.coverage.exclusions=app/modulos/*/modelos.py,app/servicios/openapi.py
