# SonarCloud · backend FastAPI (microservicios + gateway)
# Cobertura: pytest-cov → python -m pytest --cov --cov-report=xml   (deja coverage.xml aquí)
sonar.organization=nandoestebanif
sonar.projectKey=nandoestebanif_sigro-api
sonar.projectName=SIGRO · servicio
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# SonarCloud ya no usa sonar.sources: analiza toda la carpeta. Fuera: documentación y scripts de medición.
sonar.exclusions=**/__pycache__/**,docs/**
sonar.test.inclusions=pruebas/**

sonar.python.coverage.reportPaths=coverage.xml
# Fuera del cálculo de cobertura (sí se analiza su calidad): modelos SQLAlchemy (solo declaran tablas),
# migraciones de Alembic (las pruebas las aplican con «alembic upgrade head» antes de correr) y las semillas
# (scripts de carga que corre una vez el administrador).
sonar.coverage.exclusions=app/modulos/*/modelos.py,app/servicios/openapi.py,migraciones/**,semillas/**
