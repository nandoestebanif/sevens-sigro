<!-- leyenda -->
<g id="node3" class="node">
<title>leyenda</title>
<text text-anchor="start" x="19" y="-567.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#b00020">PK / FK</text>
<text text-anchor="start" x="63" y="-567.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;clave primaria / foránea (la flecha va del hijo al padre) · </text>
<text text-anchor="start" x="383" y="-567.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#e46c0a">FK*</text>
<text text-anchor="start" x="405" y="-567.2" font-family="Helvetica,sans-Serif" font-size="11.00"> apunta a otro servicio · </text>
<text text-anchor="start" x="542" y="-567.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">?</text>
<text text-anchor="start" x="549" y="-567.2" font-family="Helvetica,sans-Serif" font-size="11.00"> admite NULL</text>
<text text-anchor="start" x="19" y="-549.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#2f5597">Flecha azul gruesa</text>
<text text-anchor="start" x="135" y="-549.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;FK compuesta (id, proyecto_id): el motor garantiza que ambos son de la misma obra</text>
<text text-anchor="start" x="19" y="-531.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#c00000">FK roja discontinua</text>
<text text-anchor="start" x="138" y="-531.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;cruza de un servicio a otro. En todo el sistema hay </text>
<text text-anchor="start" x="432" y="-531.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">31</text>
<text text-anchor="start" x="448" y="-531.2" font-family="Helvetica,sans-Serif" font-size="11.00">; 15 son de autoría hacia obra.usuario.</text>
<text text-anchor="start" x="19" y="-512.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;&#160;Fase 1 (hoy): se conservan para no perder integridad; el servicio NO puede leer la tabla ajena (sin permiso), solo la referencia.</text>
<text text-anchor="start" x="19" y="-494.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;&#160;Con ADR&#45;12 (un desplegable) se conservan: dan integridad y el rol de cada módulo sigue sin poder leer el esquema ajeno.</text>
<text text-anchor="start" x="19" y="-477.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00" fill="#7f6000">UNIQUE</text>
<text text-anchor="start" x="67" y="-477.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;índice único que sostiene una regla del dominio (parcial si trae WHERE)</text>
<text text-anchor="start" x="19" y="-459.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">permisos</text>
<text text-anchor="start" x="76" y="-459.2" font-family="Helvetica,sans-Serif" font-size="11.00"> &#160;lo que el rol de cada servicio puede hacer en la tabla: S select · I insert · U update · D delete. Ningún servicio tiene D.</text>
<text text-anchor="start" x="19" y="-441.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Vistas:</text>
<text text-anchor="start" x="62" y="-441.2" font-family="Helvetica,sans-Serif" font-size="11.00"> almacen.kardex, almacen.recibido_por_compra, almacen.saldo, almacen.saldo_obra, compras.insumo_critico_vigente, compras.parametro_reposicion_vigente, compras.saldo_por_comprar, compras.solicitud_estado, compras.solicitud_linea_avance, costo.gasto_por_obra, tareo.horas_acumuladas, tareo.jornada_vigente</text>
<text text-anchor="start" x="19" y="-423.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">SECURITY DEFINER</text>
<text text-anchor="start" x="137" y="-423.2" font-family="Helvetica,sans-Serif" font-size="11.00"> (únicas que escriben periodos, plazo y correlativos, o validan contra otro esquema): compras.tg_compra_validar(), compras.tg_solicitud_numero(), obra.ampliar_plazo(), obra.generar_periodos(), tareo.tg_jornada_validar(), tareo.tg_trabajador_validar()</text>
<text text-anchor="start" x="19" y="-405.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Despliegue:</text>
<text text-anchor="start" x="92" y="-405.2" font-family="Helvetica,sans-Serif" font-size="11.00"> una instancia PostgreSQL (Neon), un esquema y un rol por módulo (SET ROLE desde Spring); ningún módulo puede leer el esquema de otro.</text>
