# SIGRO · ambiente de PRUEBAS (HT-01) en Render, plan gratuito, EN UN SOLO NODO (ADR-10). Base en Neon.
# Guía paso a paso: docs/despliegue-pruebas.md
#
# La arquitectura NO cambia: siguen siendo microservicios separados, cada uno con su proceso, su esquema y su usuario
# de base. Lo único que cambia en pruebas es DÓNDE corren: los ocho procesos viven en un mismo contenedor gratuito
# («sigro-api», api/Dockerfile.pruebas) y se hablan por 127.0.0.1, sin pasar por Cloudflare. Motivo (ADR-10): en el
# plan gratuito un servicio no puede RECIBIR tráfico por la red privada, así que gateway → servicio pasaba por
# Cloudflare y recibía 429; y cada servicio dormía por separado (~25 s en frío cada uno).
# Producción y docker-compose.yml siguen con un contenedor por servicio (api/Dockerfile).
#
# Región: ohio, la misma zona que Neon (aws-us-east-2). Render fija la región AL CREAR el servicio.
# Quitar servicios de este archivo NO los borra en Render: los ocho servicios viejos se borran a mano, al final
# (docs/despliegue-pruebas.md, «Pasar a un nodo»).

services:
  - type: web
    name: sigro-api
    runtime: docker
    region: ohio        # misma zona que Neon (aws-us-east-2). Se fija al CREAR: no se puede cambiar después
    plan: free
    dockerContext: .                       # la raíz: la imagen lleva api/, integraciones/ y notificaciones/
    dockerfilePath: ./api/Dockerfile.pruebas
    healthCheckPath: /salud                # el /salud del gateway: el único puerto público ($PORT)
    envVars:
      - key: SIGRO_ENTORNO
        value: pruebas
      - key: SIGRO_JWT_SECRET
        generateValue: true
      - key: SIGRO_SERVICIO_TOKEN          # entre servicios; integraciones lo recibe como SERVICIO_TOKEN
        generateValue: true
      - key: SIGRO_CORS                    # la web entra por su propio dominio (rewrite /api/*); se deja por si se
        value: https://sigro-web.onrender.com   # vuelve a llamar a sigro-api directo
      # Una cadena por servicio, cada una con SU usuario (sigro_<servicio>) y el host -pooler de Neon:
      #   postgresql+psycopg://sigro_<servicio>:<su clave>@<host-neon-pooler>/neondb?sslmode=require
      # El supervisor (infra/un_nodo/supervisor.py) le pasa a cada proceso SOLO la suya como SIGRO_APP_DATABASE_URL.
      # Si falta una, ese servicio no arranca y /salud/servicios lo muestra «no_responde».
      - key: SIGRO_DB_OBRAS
        sync: false
      - key: SIGRO_DB_CATALOGO
        sync: false
      - key: SIGRO_DB_COMPRAS
        sync: false
      - key: SIGRO_DB_TAREO
        sync: false
      - key: SIGRO_DB_ALMACEN
        sync: false
      - key: SIGRO_DB_COSTO
        sync: false
      - key: SIGRO_DB_RELEVO               # solo si SIGRO_UN_NODO_EXTRAS=1
        sync: false
      - key: FACTILIZA_TOKEN               # integraciones (SUNAT/RENIEC); nunca en el repositorio
        sync: false
      # Relevo y notificaciones dentro del mismo nodo. Ver ADR-10, «Memoria»: con 512 MB entran (medido en local).
      - key: SIGRO_UN_NODO_EXTRAS
        value: "1"
      # Pool chico pero persistente por servicio (app/db.py, docs/rendimiento-render.md).
      - key: SIGRO_DB_POOL
        value: "2"
      - key: SIGRO_DB_POOL_EXTRA
        value: "3"
      - key: SIGRO_DB_RECICLAR_S
        value: "240"
      - key: SIGRO_SERVER_TIMING
        value: "1"

  - type: web
    name: sigro-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    envVars:
      # La web llama a SU PROPIO dominio y Render reescribe /api/* y /salud/* hacia sigro-api (abajo): el navegador
      # no habla con otro origen (sin CORS ni preflight). Si la prueba de «Pasar a un nodo» falla, cambiar a
      # https://sigro-api.onrender.com y volver a desplegar la web (la API ya acepta ese origen por SIGRO_CORS).
      - key: VITE_API_URL
        value: https://sigro-web.onrender.com
    routes:                                # en orden: lo específico antes que el comodín de la SPA
      - type: rewrite
        source: /api/*
        destination: https://sigro-api.onrender.com/api/*
      - type: rewrite
        source: /salud/*
        destination: https://sigro-api.onrender.com/salud/*
      - type: rewrite
        source: /*
        destination: /index.html
