# SIGRO · ambiente de PRUEBAS (HT-01) en Render, plan gratuito. La base vive en Neon (PostgreSQL gestionado, gratis).
# Guía paso a paso: docs/despliegue-pruebas.md
#
# Render crea un servicio web por microservicio. Los nombres definen las URL (https://<nombre>.onrender.com):
# si Render agrega un sufijo porque el nombre está tomado, corrige las SIGRO_URL_* del grupo «sigro-comun».
# Los servicios gratuitos se duermen tras 15 min sin uso: la primera petición tarda ~1 min en despertar la cadena.

envVarGroups:
  - name: sigro-comun
    envVars:
      - key: SIGRO_ENTORNO
        value: pruebas
      - key: SIGRO_JWT_SECRET
        generateValue: true
      - key: SIGRO_SERVICIO_TOKEN
        generateValue: true
      - key: SIGRO_CORS
        value: https://sigro-web.onrender.com
      # Red privada (docs/rendimiento-render.md): en el plan gratuito un servicio web PUEDE enviar tráfico privado
      # pero NO recibirlo, así que el gateway y los servicios siguen hablándose por https://…onrender.com (pasando
      # por Cloudflare). Al pasar los servicios a un plan pago (o a «type: pserv»), en la misma región, se cambian a
      # su hostname interno, sin TLS ni Cloudflare:  http://sigro-obras:10000  ·  http://sigro-catalogo:10000 …
      - key: SIGRO_URL_OBRAS
        value: https://sigro-obras.onrender.com
      - key: SIGRO_URL_CATALOGO
        value: https://sigro-catalogo.onrender.com
      - key: SIGRO_URL_COMPRAS
        value: https://sigro-compras.onrender.com
      - key: SIGRO_URL_TAREO
        value: https://sigro-tareo.onrender.com
      - key: SIGRO_URL_ALMACEN
        value: https://sigro-almacen.onrender.com
      - key: SIGRO_URL_COSTO
        value: https://sigro-costo.onrender.com
      - key: SIGRO_INTEGRACIONES_URL
        value: https://sigro-integraciones.onrender.com
      # Pool chico pero persistente por servicio (app/db.py). Con la cadena -pooler de Neon, 2+3 por servicio
      # sobra; reciclar a los 240 s evita usar una conexión que Neon cortó al suspender el cómputo (5 min).
      - key: SIGRO_DB_POOL
        value: "2"
      - key: SIGRO_DB_POOL_EXTRA
        value: "3"
      - key: SIGRO_DB_RECICLAR_S
        value: "240"
      # Server-Timing y CF-Ray en el log (app/medicion.py). "0" quita la cabecera; el log se mantiene.
      - key: SIGRO_SERVER_TIMING
        value: "1"

services:
  - type: web
    name: sigro-gateway
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /salud
    envVars:
      - fromGroup: sigro-comun
      - key: SERVICIO          # Render pasa las variables como build args: la imagen se poda a este servicio
        value: gateway
      - key: SIGRO_SERVICIO
        value: gateway

  - type: web
    name: sigro-obras
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /salud
    envVars:
      - fromGroup: sigro-comun
      - key: SERVICIO
        value: obras
      - key: SIGRO_SERVICIO
        value: obras
      # Cadena CON pooling de Neon (host «ep-…-pooler…»): la usan los servicios en ejecución. Las migraciones
      # siguen con la directa (SIGRO_DATABASE_URL, sin -pooler), que se usa a mano desde docs/despliegue-pruebas.md.
      # El log de arranque dice «sigro base: pooler=sí» si quedó bien.
      - key: SIGRO_APP_DATABASE_URL   # postgresql+psycopg://sigro_obras:<clave>@<host-neon-pooler>/neondb?sslmode=require
        sync: false

  - type: web
    name: sigro-catalogo
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /salud
    envVars:
      - fromGroup: sigro-comun
      - key: SERVICIO
        value: catalogo
      - key: SIGRO_SERVICIO
        value: catalogo
      - key: SIGRO_APP_DATABASE_URL   # con -pooler, como obras
        sync: false

  - type: web
    name: sigro-compras
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /salud
    envVars:
      - fromGroup: sigro-comun
      - key: SERVICIO
        value: compras
      - key: SIGRO_SERVICIO
        value: compras
      - key: SIGRO_APP_DATABASE_URL   # con -pooler, como obras
        sync: false

  - type: web
    name: sigro-tareo
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /salud
    envVars:
      - fromGroup: sigro-comun
      - key: SERVICIO
        value: tareo
      - key: SIGRO_SERVICIO
        value: tareo
      - key: SIGRO_APP_DATABASE_URL   # con -pooler, como obras
        sync: false

  - type: web
    name: sigro-almacen
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /salud
    envVars:
      - fromGroup: sigro-comun
      - key: SERVICIO
        value: almacen
      - key: SIGRO_SERVICIO
        value: almacen
      - key: SIGRO_APP_DATABASE_URL   # postgresql+psycopg://sigro_almacen:<clave>@<host-neon-pooler>/neondb?sslmode=require (migración 0010)
        sync: false

  - type: web
    name: sigro-costo
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /salud
    envVars:
      - fromGroup: sigro-comun
      - key: SERVICIO
        value: costo
      - key: SIGRO_SERVICIO
        value: costo
      - key: SIGRO_APP_DATABASE_URL   # postgresql+psycopg://sigro_costo:<clave>@<host-neon-pooler>/neondb?sslmode=require (migración 0010)
        sync: false

  - type: web
    name: sigro-integraciones
    runtime: docker
    plan: free
    dockerContext: ./integraciones
    dockerfilePath: ./integraciones/Dockerfile
    healthCheckPath: /salud
    envVars:
      - key: FACTILIZA_TOKEN      # se escribe en el panel de Render, nunca en el repositorio
        sync: false
      # La web ya no llama a Integraciones: el S10 entra por el gateway (POST /api/v1/catalogo/importaciones-s10)
      # y el catálogo lo reenvía con X-Servicio-Token. Falta activar aquí SERVICIO_TOKEN con el mismo valor que
      # SIGRO_SERVICIO_TOKEN de «sigro-comun» (plan, tarea 2).

  - type: web
    name: sigro-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    envVars:
      - key: VITE_API_URL
        value: https://sigro-gateway.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# Fuera del plan gratuito (se agregan cuando haga falta):
#   relevo y notificaciones: los avisos se acumulan en outbox.evento y no se pierden; se entregan cuando se despliegue el relevo.
#   Ojo (0010): el relevo también lleva a costo los eventos de integración de almacén. Sin relevo, el stock y el kárdex
#   funcionan (son de almacén) pero GET /costo/gasto muestra recibido/consumido/en stock en cero hasta que se despliegue.
